<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="Daily Temperature Forecasting, live v1.0.0. Test RMSE 2.147 degrees C, about 13 percent better than the persistence baseline.">
  <style>
